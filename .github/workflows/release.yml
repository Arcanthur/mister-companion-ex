name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-backend/requirements.txt

      - name: Verify public npm registry lockfile
        run: npm run check:lockfile

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r python-backend/requirements.txt

      - name: Verify release tag and version
        run: npm run release:verify -- "${{ github.ref_name }}"

      - name: Validate source
        run: npm run check

      - name: Select Windows signing mode
        id: signing
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)
          $requiresSigning = $env:RELEASE_TAG -match '^v(?:[1-9]\d*)\.'

          if ($hasCertificate -xor $hasPassword) {
            throw "Windows signing is only partially configured. Set both WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD, or remove both."
          }

          if ($hasCertificate) {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Windows signing is enabled."
          } elseif ($requiresSigning) {
            throw "Windows signing is required for $env:RELEASE_TAG and later. Configure both signing secrets before publishing."
          } else {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Warning "Windows signing is not configured. Publishing an unsigned pre-1.0 build."
          }

      - name: Build signed Windows portable executable
        if: steps.signing.outputs.enabled == 'true'
        run: npm run dist:signed
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Build unsigned Windows portable executable
        if: steps.signing.outputs.enabled != 'true'
        run: npm run dist

      - name: Verify Authenticode signature
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem release -File -Filter *.exe)
          if ($executables.Count -eq 0) {
            throw "No Windows executable was produced."
          }
          foreach ($executable in $executables) {
            $signature = Get-AuthenticodeSignature -LiteralPath $executable.FullName
            if ($signature.Status -ne "Valid" -or -not $signature.SignerCertificate) {
              throw "$($executable.Name) does not have a valid Authenticode signature: $($signature.StatusMessage)"
            }
            if (-not $signature.TimeStamperCertificate) {
              throw "$($executable.Name) has no trusted timestamp signature."
            }
            Write-Host "Verified $($executable.Name)"
            Write-Host "Signer: $($signature.SignerCertificate.Subject)"
            Write-Host "Timestamp: $($signature.TimeStamperCertificate.Subject)"
          }

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem release -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -Encoding ascii release/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiSTer-Companion-EX-${{ github.ref_name }}-Windows
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          files: |
            release/*.exe
            release/SHA256SUMS.txt
