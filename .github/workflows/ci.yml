name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build and validate
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify public npm registry lockfile
        run: npm run check:lockfile

      - name: Install Node.js dependencies
        run: npm ci

      - name: Audit Node.js dependencies
        run: npm audit --audit-level=high

      - name: Build renderer
        run: npm run build

      - name: Lint JavaScript
        run: npm run lint

      - name: Test JavaScript
        run: npm run test:js

      - name: Check Electron and utility scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem electron, scripts -Recurse -File -Include *.cjs, *.js
          foreach ($file in $files) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-backend/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r python-backend/requirements.txt

      - name: Check Python backend syntax
        run: python -m compileall -q python-backend

      - name: Test Python backend
        run: npm run test:python
